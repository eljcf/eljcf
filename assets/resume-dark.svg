<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 100" width="1600" role="img" aria-label="View resume">
  <defs><style>
  .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .spine { stroke-dasharray: 3 10; animation: route 14s linear infinite; }
  @keyframes route { to { stroke-dashoffset: -52; } }
</style></defs><rect width="1600" height="100" fill="#10231C"/>
  <path class="spine" d="M34 0V100" fill="none" stroke="#395249" stroke-width="1.5"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.33s" dur="1s" fill="freeze"/>
    <rect x="70" y="22" width="254" height="52" fill="#EEF0E9"/>
    <rect x="70" y="22" width="6" height="52" fill="#D06A53"/>
    <text class="mono" x="100" y="55" fill="#10231C" font-size="14" font-weight="600" letter-spacing="1.5">VIEW RESUME ↗</text>
  </g>
</svg>
