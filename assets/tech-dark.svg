<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" width="1600" role="img" aria-label="Tech stack">
  <defs><style>
  .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .thread { stroke-dasharray: 9 15; animation: drift 12s linear infinite; }
  .reveal-two { animation: reveal-two 4s ease both; }
  .reveal-three { animation: reveal-three 4s ease both; }
  @keyframes drift { to { stroke-dashoffset: -96; } }
  @keyframes reveal-two { 0%,18% { opacity:0; } 36%,100% { opacity:1; } }
  @keyframes reveal-three { 0%,48% { opacity:0; } 68%,100% { opacity:1; } }
</style></defs>
  <rect width="1600" height="250" fill="#14291F"/>
  <path class="thread" d="M120 0 C120 85 255 60 315 140 C380 220 1330 135 1480 250" fill="none" stroke="#D06A53" stroke-width="2" stroke-opacity="0.5"/>
  <text class="mono" x="70" y="54" fill="#91A398" font-size="11" letter-spacing="1.8">02 / TECH STACK</text>
  <g class="mono" font-size="11" letter-spacing="1.5" fill="#91A398">
    <text x="70" y="116">PRODUCT</text><text x="70" y="174">BUILD</text>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#EEF0E9">
    <text x="230" y="117">AI Product · RAG · Agent Systems</text>
    <text x="230" y="175">JavaScript · Chrome Extension · DOM API</text>
  </g>
</svg>
