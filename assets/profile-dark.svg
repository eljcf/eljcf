<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" role="img" aria-labelledby="title desc">
  <title id="title">Raz — AI Product, RAG, Agents and Developer Tools</title>
  <desc id="desc">A refined animated system map connecting context, models, tools and evaluation into useful AI products.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D66A52"/>
      <stop offset="1" stop-color="#A94032"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1F19"/>
      <stop offset="1" stop-color="#10271F"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#A7B9AC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif; }
      .sans { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 5 8; animation: flow 8s linear infinite; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .cursor { animation: blink 1.2s step-end infinite; }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @keyframes pulse { 0%,100% { opacity:.28; transform:scale(.88); } 50% { opacity:.06; transform:scale(1.18); } }
      @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="338" rx="22" fill="url(#wash)" stroke="#2B4539"/>
  <rect x="1" y="1" width="958" height="338" rx="22" fill="url(#grid)"/>
  <ellipse cx="790" cy="78" rx="160" ry="110" fill="#C85A45" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="565" cy="278" rx="130" ry="90" fill="#527865" opacity="0.12" filter="url(#soft)"/>

  <g class="mono" font-size="12" letter-spacing="1.4">
    <text x="48" y="45" fill="#B1C2B5">RAZ / PRODUCT SYSTEMS</text>
    <text x="912" y="45" text-anchor="end" fill="#62796B">PROFILE — 2026</text>
  </g>
  <line x1="48" y1="61" x2="912" y2="61" stroke="#365145" stroke-opacity="0.85"/>

  <g class="sans">
    <text x="54" y="105" fill="#E07A60" font-size="13" font-weight="650" letter-spacing="2.2">AI PRODUCT · RAG · AGENTS</text>
    <text class="serif" x="52" y="165" fill="#EDF3ED" font-size="52" font-weight="400" letter-spacing="-1.4">Make AI useful.</text>
    <text class="serif" x="52" y="217" fill="url(#accent)" font-size="52" font-weight="400" font-style="italic" letter-spacing="-1.4">Make it real.</text>
    <text x="56" y="255" fill="#A9B8AD" font-size="17">From real problems to working AI products.</text>
  </g>

  <g class="mono" font-size="11" font-weight="600">
    <rect x="54" y="279" width="136" height="28" rx="14" fill="#152B22" fill-opacity="0.9" stroke="#3A5144"/>
    <text x="122" y="297" text-anchor="middle" fill="#B7C6BA">PRODUCT DESIGN</text>
    <rect x="200" y="279" width="115" height="28" rx="14" fill="#152B22" fill-opacity="0.9" stroke="#3A5144"/>
    <text x="257.5" y="297" text-anchor="middle" fill="#B7C6BA">RAG SYSTEMS</text>
    <rect x="325" y="279" width="126" height="28" rx="14" fill="#152B22" fill-opacity="0.9" stroke="#3A5144"/>
    <text x="388" y="297" text-anchor="middle" fill="#B7C6BA">AGENT TOOLING</text>
  </g>

  <g transform="translate(565 91)">
    <circle class="pulse" cx="170" cy="84" r="74" fill="none" stroke="#D66A52" stroke-width="18"/>
    <path class="flow" d="M60 25 L137 68 M280 25 L203 68 M60 160 L137 101 M280 160 L203 101" fill="none" stroke="#738D7C" stroke-width="1.5"/>
    <path d="M60 25 L137 68 M280 25 L203 68 M60 160 L137 101 M280 160 L203 101" fill="none" stroke="#D8E6DB" stroke-opacity="0.16" stroke-width="1"/>

    <g class="mono" font-size="11" text-anchor="middle">
      <rect x="8" y="5" width="104" height="40" rx="12" fill="#152B22" stroke="#3A5144"/>
      <text x="60" y="29" fill="#B7C6BA">CONTEXT</text>
      <rect x="228" y="5" width="104" height="40" rx="12" fill="#152B22" stroke="#3A5144"/>
      <text x="280" y="29" fill="#B7C6BA">TOOLS</text>
      <rect x="8" y="140" width="104" height="40" rx="12" fill="#152B22" stroke="#3A5144"/>
      <text x="60" y="164" fill="#B7C6BA">EVALUATION</text>
      <rect x="228" y="140" width="104" height="40" rx="12" fill="#152B22" stroke="#3A5144"/>
      <text x="280" y="164" fill="#B7C6BA">EXPERIENCE</text>
    </g>

    <rect x="119" y="59" width="102" height="55" rx="16" fill="#091511"/>
    <rect x="120" y="60" width="100" height="53" rx="15" fill="url(#accent)" opacity="0.9"/>
    <text class="mono" x="170" y="82" text-anchor="middle" fill="#FFFFFF" font-size="11" letter-spacing="1">AI PRODUCT</text>
    <text class="sans" x="170" y="100" text-anchor="middle" fill="#FFFFFF" font-opacity="0.82" font-size="11">useful × real</text>

    <circle r="4" fill="#E07A60">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M60 25 L137 68"/>
    </circle>
    <circle r="4" fill="#A9C8AF">
      <animateMotion dur="5.6s" repeatCount="indefinite" path="M280 160 L203 101"/>
    </circle>
  </g>

  <g class="mono" font-size="11">
    <text x="565" y="300" fill="#738D7C">$ design → prototype → evaluate → ship</text>
    <rect class="cursor" x="866" y="290" width="7" height="13" rx="1" fill="#D66A52"/>
  </g>
</svg>
