name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current-year contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          year=$(date -u +%Y)
          gh api graphql -f query="query { user(login: \"${{ github.repository_owner }}\") { contributionsCollection(from: \"${year}-01-01T00:00:00Z\", to: \"${year}-12-31T23:59:59Z\") { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel } } } } } }" > dist/contributions.json
      - name: Generate DFS snake
        run: |
          python3 .github/scripts/generate_snake.py dist/contributions.json light dist/dfs-snake-2026.svg
          python3 .github/scripts/generate_snake.py dist/contributions.json dark dist/dfs-snake-2026-dark.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
